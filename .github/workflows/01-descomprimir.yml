
name: Nexora 2.0 - Descomprimir proyecto

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Mostrar archivos del repositorio
        shell: bash
        run: |
          set -euo pipefail

          echo "=== RAÍZ DEL REPOSITORIO ==="
          ls -lah "$GITHUB_WORKSPACE"

          echo "=== ARCHIVOS ZIP ==="
          find "$GITHUB_WORKSPACE" \
            -type f -iname '*.zip' \
            -not -path '*/.git/*' -print

      - name: Buscar y descomprimir ZIP
        shell: bash
        run: |
          set -euo pipefail

          DESTINO="$RUNNER_TEMP/nexora"
          mkdir -p "$DESTINO"

          mapfile -d '' ZIPS < <(
            find "$GITHUB_WORKSPACE" \
              -type f -iname '*.zip' \
              -not -path '*/.git/*' -print0
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::error::No se encontró ningún ZIP."
            exit 1
          fi

          ZIP=""

          for FILE in "${ZIPS[@]}"; do
            if [[ "$(basename "$FILE")" =~ [Nn]exora ]]; then
              ZIP="$FILE"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            if [ "${#ZIPS[@]}" -eq 1 ]; then
              ZIP="${ZIPS[0]}"
            else
              echo "::error::Hay varios ZIP y ninguno contiene Nexora en el nombre."
              printf '%s\n' "${ZIPS[@]}"
              exit 1
            fi
          fi

          echo "ZIP seleccionado: $ZIP"
          unzip -t "$ZIP"
          unzip -o "$ZIP" -d "$DESTINO"

          echo "EXTRACT_ROOT=$DESTINO" >> "$GITHUB_ENV"

          echo "=== CONTENIDO EXTRAÍDO ==="
          find "$DESTINO" -maxdepth 5 -print \
            | sort | head -n 500

      - name: Validar estructura Android
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$EXTRACT_ROOT"

          echo "=== ARCHIVOS DE CONFIGURACIÓN ==="
          find "$ROOT" -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name build.gradle \
            -o -name build.gradle.kts \
            -o -name libs.versions.toml \
            -o -name gradlew \
          \) -print | sort

          SETTINGS="$(find "$ROOT" -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::No se encontró settings.gradle."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::No se encontró app junto a settings.gradle."
            exit 1
          fi

          echo "Proyecto detectado: $PROJECT_DIR"
          echo "Se permite que el ZIP no incluya gradlew."

          echo "=== ARCHIVOS GRADLE DEL PROYECTO ==="
          find "$PROJECT_DIR" -maxdepth 4 -type f \
            | sort | head -n 500

      - name: Preparar artefacto del proyecto
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$EXTRACT_ROOT"

          SETTINGS="$(find "$ROOT" -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::No se encontró settings.gradle."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::No se encontró el módulo app."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/paquete"
          cd "$PROJECT_DIR"

          zip -qr "$RUNNER_TEMP/paquete/Nexora-extraido.zip" .

          echo "Proyecto empaquetado correctamente."

      - name: Guardar proyecto extraído
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-proyecto-extraido
          path: ${{ runner.temp }}/paquete/Nexora-extraido.zip
          if-no-files-found: error
          retention-days: 7
