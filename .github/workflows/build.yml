
name: Compilar APK Nexora 2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Construir APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Descargar el repositorio
      - name: Descargar código fuente
        uses: actions/checkout@v4

      # 2. Configurar Java
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configurar Android SDK
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # 4. Aceptar licencias sin utilizar yes | sdkmanager
      - name: Aceptar licencias Android
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager | sort -V | tail -n 1)
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::No se encontró sdkmanager."
            exit 1
          fi

          # El proceso de setup-android normalmente gestiona
          # las licencias necesarias. Este comando comprueba
          # su estado sin crear una tubería que provoque Broken pipe.
          if ! "$SDKMANAGER" --licenses < /dev/null; then
            echo "::error::Hay licencias pendientes de aceptar."
            echo "Revisa la configuración del Android SDK."
            exit 1
          fi

      # 5. Localizar el proyecto Android
      - name: Localizar proyecto Android
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            PROJECT_DIR="."
          else
            GRADLEW=$(find . \
              -type f \
              -name gradlew \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*" \
              | head -n 1 || true)

            if [ -z "$GRADLEW" ]; then
              echo "::error::No se encontró gradlew."
              echo "Sube el proyecto Android completo al repositorio."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$GRADLEW")
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::Falta settings.gradle o settings.gradle.kts."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::No se encontró el módulo app."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Proyecto localizado en: $PROJECT_DIR"

      # 6. Configurar Gradle
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # 7. Preparar Gradle Wrapper
      - name: Preparar compilador Gradle
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: chmod +x ./gradlew

      # 8. Compilar APK
      - name: Compilar Nexora Debug
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace

      # 9. Verificar APK
      - name: Verificar APK generado
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "::error::No se generó el APK."
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      # 10. Publicar APK descargable
      - name: Publicar APK Nexora 2.0
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-2.0-APK
          path: ${{ steps.project.outputs.dir }}/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
