
name: Compilar APK Nexora 2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicación Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - 
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Aceptar licencias Android
        shell: bash
        run: |
          yes | sdkmanager --licenses \
            || true

      - name: Instalar herramientas Android
        shell: bash
        run: |
          sdkmanager "platform-tools"


      - name: Localizar proyecto Android
        id: proyecto
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            GRADLEW=$(find . -type f -name gradlew \
              -not -path "*/.gradle/*" | head -n 1)

            if [ -z "$GRADLEW" ]; then
              echo "::error::No se encontró gradlew."
              echo "Debes subir un proyecto Android completo."
              exit 1
            fi

            echo "dir=$(dirname "$GRADLEW")" \
              >> "$GITHUB_OUTPUT"
          fi

      - name: Dar permisos al compilador
        working-directory: ${{ steps.proyecto.outputs.dir }}
        run: chmod +x ./gradlew

      - name: Compilar APK de depuración
        working-directory: ${{ steps.proyecto.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-2.0-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
