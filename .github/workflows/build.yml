
name: Descomprimir Nexora 2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  descomprimir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Mostrar archivos disponibles
        shell: bash
        run: |
          set -euo pipefail

          echo "Contenido de la raíz:"
          ls -la

          echo "Buscando archivos ZIP:"
          find "$GITHUB_WORKSPACE" \
            -type f -iname '*.zip' \
            -not -path '*/.git/*' -print

      - name: Encontrar y descomprimir ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -type f -iname '*.zip' \
              -not -path '*/.git/*' \
              -print0
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "::error::No hay archivos ZIP en el repositorio."
            echo "Debes subir el ZIP a GitHub y guardar los cambios."
            exit 1
          fi

          echo "ZIP encontrados: ${#ZIP_FILES[@]}"

          ZIP_FILE=""

          for FILE in "${ZIP_FILES[@]}"; do
            if [[ "$(basename "$FILE")" == *Nexora* ]]; then
              ZIP_FILE="$FILE"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            if [ "${#ZIP_FILES[@]}" -eq 1 ]; then
              ZIP_FILE="${ZIP_FILES[0]}"
            else
              echo "::error::Hay varios ZIP y ninguno tiene Nexora en su nombre."
              printf '%s\n' "${ZIP_FILES[@]}"
              echo "Renombra el ZIP correcto para incluir Nexora."
              exit 1
            fi
          fi

          echo "Archivo seleccionado: $ZIP_FILE"

          echo "Verificando el archivo..."
          unzip -t "$ZIP_FILE"

          DESTINO="$GITHUB_WORKSPACE/proyecto"
          mkdir -p "$DESTINO"

          echo "Descomprimiendo..."
          unzip -o "$ZIP_FILE" -d "$DESTINO"

          echo "Archivos extraídos:"
          find "$DESTINO" -maxdepth 5 -type f \
            | sort | head -n 300

          echo "DESCOMPRESION_OK=true" >> "$GITHUB_ENV"

      - name: Comprobar proyecto Android
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/proyecto"

          SETTINGS="$(find "$ROOT" -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::ZIP extraído, pero no contiene settings.gradle(.kts)."
            echo "Revisa si el ZIP contiene el proyecto Android correcto."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Proyecto localizado: $PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::Falta la carpeta app."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "::error::Falta gradlew."
            exit 1
          fi

          echo "El proyecto Android tiene los archivos básicos."
