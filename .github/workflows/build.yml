
name: Nexora 2.0 - Descomprimir y compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Mostrar archivos del repositorio
        shell: bash
        run: |
          set -euo pipefail
          echo "=== RAÍZ DEL REPOSITORIO ==="
          ls -la
          echo "=== ARCHIVOS ZIP ==="
          find "$GITHUB_WORKSPACE" \
            -type f -iname '*.zip' \
            -not -path '*/.git/*' -print

      - name: Buscar y descomprimir ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -type f -iname '*.zip' \
              -not -path '*/.git/*' \
              -print0
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "::error::No se encontró ningún ZIP en el repositorio."
            echo "Sube el ZIP a GitHub y guarda los cambios."
            exit 1
          fi

          ZIP_FILE=""

          for FILE in "${ZIP_FILES[@]}"; do
            if [[ "$(basename "$FILE")" == *Nexora* ]]; then
              ZIP_FILE="$FILE"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            if [ "${#ZIP_FILES[@]}" -eq 1 ]; then
              ZIP_FILE="${ZIP_FILES[0]}"
            else
              echo "::error::Hay varios ZIP y ninguno contiene Nexora en su nombre."
              printf '%s\n' "${ZIP_FILES[@]}"
              exit 1
            fi
          fi

          echo "ZIP seleccionado: $ZIP_FILE"

          unzip -t "$ZIP_FILE"

          DESTINO="$RUNNER_TEMP/nexora_extraido"
          mkdir -p "$DESTINO"

          unzip -o "$ZIP_FILE" -d "$DESTINO"

          echo "EXTRACT_ROOT=$DESTINO" >> "$GITHUB_ENV"

          echo "=== CONTENIDO EXTRAÍDO ==="
          find "$DESTINO" -maxdepth 6 -type f \
            | sort | head -n 500

      - name: Diagnosticar estructura del proyecto
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$EXTRACT_ROOT"

          echo "=== ARCHIVOS GRADLE ==="
          find "$ROOT" -type f \( \
            -name gradlew -o \
            -name gradlew.bat -o \
            -name gradle-wrapper.jar -o \
            -name settings.gradle -o \
            -name settings.gradle.kts -o \
            -name build.gradle -o \
            -name build.gradle.kts \
          \) -print

          SETTINGS="$(find "$ROOT" -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::El ZIP no contiene settings.gradle ni settings.gradle.kts."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Proyecto detectado: $PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::No se encontró el módulo app."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "::error::Falta gradlew. El ZIP no contiene el Gradle Wrapper."
            echo "Consulta la lista de archivos mostrada en el paso anterior."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::Falta gradle/wrapper/gradle-wrapper.jar."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Estructura básica comprobada."

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceptar licencias del SDK
        shell: bash
        run: |
          set -e
          set +o pipefail
          yes | sdkmanager --licenses || true

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::No se encontró ningún APK generado."
            exit 1
          fi

          echo "APK generado correctamente:"
          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
