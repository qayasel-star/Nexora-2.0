
name: Compilar APK Nexora 2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Construir APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Descargar el código fuente
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Configurar Java
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configurar Android SDK
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # 4. Aceptar las licencias Android
      - name: Aceptar licencias del SDK
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses
          echo "Licencias Android procesadas."

      # 5. Buscar el proyecto Android
      - name: Localizar proyecto Android
        id: project
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            PROJECT_DIR="."
          else
            GRADLEW=$(find . \
              -type f \
              -name gradlew \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*" \
              | head -n 1)

            if [ -z "$GRADLEW" ]; then
              echo "::error::No se encontró gradlew."
              echo "El repositorio debe contener un proyecto Android completo."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$GRADLEW")
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::Falta settings.gradle o settings.gradle.kts."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::No se encontró el módulo app."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Proyecto localizado en: $PROJECT_DIR"

      # 6. Preparar Gradle
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # 7. Dar permisos al compilador
      - name: Preparar Gradle Wrapper
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: chmod +x ./gradlew

      # 8. Compilar la aplicación
      - name: Compilar APK Debug
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace

      # 9. Verificar que se haya generado el APK
      - name: Verificar APK
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::La compilación terminó sin generar un APK."
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK generado: $APK"

      # 10. Publicar APK descargable
      - name: Publicar APK Nexora 2.0
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-2.0-APK
          path: ${{ steps.project.outputs.dir }}/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
