
name: Descomprimir Nexora 2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  descomprimir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar herramienta ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Buscar ZIP de Nexora
        shell: bash
        run: |
          set -euo pipefail

          echo "Buscando el ZIP de Nexora..."

          ZIP_FILE=""

          while IFS= read -r -d '' FILE; do
            if [[ "$(basename "$FILE")" == \
              "Nexora_Beta14_Sin_Menu_Lateral.zip" ]]; then
              ZIP_FILE="$FILE"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f -iname '*.zip' \
              -not -path '*/.git/*' -print0
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No se encontró Nexora_Beta14_Sin_Menu_Lateral.zip."
            echo "Sube el archivo ZIP a la raíz del repositorio."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Verificar integridad del ZIP
        run: |
          set -euo pipefail
          unzip -t "$ZIP_FILE"

      - name: Descomprimir proyecto
        shell: bash
        run: |
          set -euo pipefail

          DESTINO="$GITHUB_WORKSPACE/proyecto"
          mkdir -p "$DESTINO"

          unzip -o "$ZIP_FILE" -d "$DESTINO"

          echo "Archivos extraídos:"
          find "$DESTINO" -maxdepth 5 -type f \
            | sort | head -n 300

      - name: Comprobar estructura Android
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/proyecto"

          SETTINGS="$(find "$ROOT" -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::No se encontró settings.gradle ni settings.gradle.kts."
            echo "Comprueba que el ZIP contenga el proyecto Android completo."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Proyecto Android localizado en: $PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::No se encontró el módulo app."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "::error::Falta el archivo gradlew."
            exit 1
          fi

          echo "Verificación de estructura completada."
