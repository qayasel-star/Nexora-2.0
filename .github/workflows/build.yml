
name: Preparar Nexora 2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  preparar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Localizar y descomprimir ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Buscando archivos ZIP..."

          find . -type f -iname "*.zip" \
            -not -path "./.git/*" -print

          ZIP_FILE="$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No se encontró el ZIP en el repositorio."
            exit 1
          fi

          echo "Archivo encontrado: $ZIP_FILE"

          echo "Verificando integridad del ZIP..."
          unzip -t "$ZIP_FILE"

          mkdir -p proyecto

          echo "Descomprimiendo Nexora..."
          unzip -o "$ZIP_FILE" -d proyecto

          echo "Contenido descomprimido:"
          find proyecto -maxdepth 5 -type f \
            | sort | head -n 300

          echo "Comprobando archivos Gradle..."

          if find proyecto -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit | grep -q .; then
            echo "Correcto: se encontró la configuración del proyecto."
          else
            echo "::error::El ZIP no contiene settings.gradle ni settings.gradle.kts."
            exit 1
          fi
