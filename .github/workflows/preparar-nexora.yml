
name: Preparar proyecto Nexora

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar herramienta ZIP
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Buscar y descomprimir ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' \
            -not -path './.git/*' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró ningún archivo ZIP."
            echo "Sube el ZIP del proyecto al repositorio."
            exit 1
          fi

          echo "Descomprimiendo: $ZIP_FILE"
          mkdir -p source
          unzip -o "$ZIP_FILE" -d source

          echo "Contenido descomprimido:"
          find source -maxdepth 3 -type f | head -n 100

      - name: Comprobar estructura Android
        shell: bash
        run: |
          if find source -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | grep -q .; then
            echo "Proyecto Gradle Android localizado."
          else
            echo "ERROR: No se encontró settings.gradle ni settings.gradle.kts."
            exit 1
          fi
